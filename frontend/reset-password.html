<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Smart Placement Tracker AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #10172f, #243b70, #5368bb);
        }
        
        .card {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            border: 1px solid #ffffff30;
            border-radius: 22px;
            background: #ffffff12;
            box-shadow: 0 20px 55px #0003;
            backdrop-filter: blur(14px);
        }
        
        .logo {
            text-align: center;
            font-size: 38px;
            margin-bottom: 14px;
        }
        
        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 12px;
        }
        
        .description {
            text-align: center;
            color: #d8e1ff;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin: 16px 0 8px;
        }
        
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ffffff50;
            border-radius: 10px;
            background: #ffffff15;
            color: white;
            font-size: 15px;
            outline: none;
        }
        
        input:focus {
            border-color: #a8c7ff;
        }
        
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #82a8ff;
            color: #10172f;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            background: #a8c7ff;
        }
        
        button:disabled {
            opacity: .6;
            cursor: wait;
        }
        
        #message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }
        
        .back {
            margin-top: 22px;
            text-align: center;
        }
        
        a {
            color: #c8d9ff;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="logo">🔐</div>
        <h1>Reset Password</h1>
        <p class="description">
            Create a new, strong password for your account.
        </p>

        <form id="resetForm">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" autocomplete="new-password" minlength="8" placeholder="Enter new password" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" placeholder="Re-enter new password" required>

            <button type="submit" id="submitBtn">Reset Password</button>
        </form>

        <p id="message" role="status"></p>

        <p class="back"><a href="login.html">← Back to Login</a></p>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitBtn");

        if (!token) {
            message.textContent =
                "Reset token is missing. Please request a new reset link.";
            button.disabled = true;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const newPassword =
                document.getElementById("newPassword").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            button.disabled = true;
            button.textContent = "Resetting...";
            message.textContent = "";

            try {
                const response = await fetch("https://spt-ai-backend.onrender.com/api/users/reset-password", {
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword,
                        confirmPassword: confirmPassword
                    })
                });

                const data = await response.json();
                message.textContent = data.message || data.error ||
                    "Unable to reset password.";

                if (response.ok) {
                    form.reset();
                    button.disabled = true;
                } else {
                    button.disabled = false;
                }
            } catch (error) {
                message.textContent =
                    "Could not connect to the backend. Make sure Spring Boot is running.";
                button.disabled = false;
            } finally {
                button.textContent = "Reset Password";
            }
        });
    </script>
</body>

</html>
