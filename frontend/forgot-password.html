<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Smart Placement Tracker AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #10172f, #243b70, #5368bb);
            color: #fff;
        }
        
        .card {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            border: 1px solid #ffffff30;
            border-radius: 22px;
            background: #ffffff12;
            box-shadow: 0 20px 55px #0003;
            backdrop-filter: blur(14px);
        }
        
        .logo {
            font-size: 38px;
            text-align: center;
            margin-bottom: 16px;
        }
        
        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 12px;
        }
        
        .description {
            text-align: center;
            color: #d8e1ff;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        
        label {
            display: block;
            margin-bottom: 9px;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ffffff50;
            border-radius: 10px;
            background: #ffffff15;
            color: white;
            outline: none;
            margin-bottom: 20px;
            font-size: 15px;
        }
        
        input::placeholder {
            color: #d0d8f0;
        }
        
        input:focus {
            border-color: #a8c7ff;
        }
        
        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #82a8ff;
            color: #10172f;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        
        button:hover {
            background: #a8c7ff;
        }
        
        button:disabled {
            opacity: .6;
            cursor: wait;
        }
        
        #message {
            margin-top: 18px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            text-align: center;
        }
        
        .back {
            text-align: center;
            margin-top: 24px;
        }
        
        a {
            color: #c8d9ff;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="logo">🎓</div>
        <h1>Forgot Password?</h1>
        <p class="description">
            Enter your registered email address to generate a password reset link.
        </p>

        <form id="forgotForm">
            <label for="email">Registered Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            <button type="submit" id="submitBtn">Generate Reset Link</button>
        </form>

        <p id="message" role="status"></p>

        <p class="back">
            <a href="login.html">← Back to Login</a>
        </p>
    </main>

    <script>
        const form = document.getElementById("forgotForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitBtn");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Generating...";

            try {
                const response = await fetch(
                    "http://localhost:8080/api/users/forgot-password", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({
                            email: document.getElementById("email").value.trim()
                        })
                    }
                );

                const data = await response.json();

                message.textContent = data.message || data.error ||
                    "Unable to process your request.";
            } catch (error) {
                message.textContent =
                    "Could not connect to the backend. Make sure Spring Boot is running.";
            } finally {
                button.disabled = false;
                button.textContent = "Generate Reset Link";
            }
        });
    </script>
</body>

</html>
